[package]
name = "bb-agent-tui"
version = "0.1.0"
edition = "2024"
description = "Qwen Code compatible Ratatui frontend for bb-agent"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["crossterm", "scrolling-regions", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = true
