version: 2
updates:
  - package-ecosystem: cargo
    directory: /apps/tui-rs
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
