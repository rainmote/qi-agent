name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
      - name: Install Babashka
        run: |
          scripts/install-ci-babashka.sh "$RUNNER_TEMP/qi-agent-bin"
          echo "$RUNNER_TEMP/qi-agent-bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/tui-rs/Cargo.toml --all -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path apps/tui-rs/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path apps/tui-rs/Cargo.toml --locked
      - name: Type-check web applications
        run: npm run typecheck
      - name: Test web host
        run: npm run test:web
      - name: Test web UI
        run: npm run test:web-ui
      - name: Test ACP editor protocol with isolated workers
        run: npm run test:acp
      - name: Build production Web application
        run: npm run web:build
      - name: Install pinned Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Test production Web in Chromium with isolated API fixtures
        if: runner.os == 'Linux'
        run: npm run test:web-browser:ci
      - name: Test Clojure runtime
        run: bb test
      - name: Test evaluation fixtures and graders without model calls
        run: npm run test:eval
      - name: Test a real terminal session
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --manifest-path apps/tui-rs/Cargo.toml
          expect apps/tui-rs/tests/pty-smoke.exp

  msrv:
    name: MSRV 1.88 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
          key: msrv-1.88
      - name: Build all Rust targets at the minimum supported version
        run: cargo build --locked --all-targets --manifest-path apps/tui-rs/Cargo.toml

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Audit JavaScript production dependencies
        run: npm audit --registry=https://registry.npmjs.org --audit-level=low
      - name: Install RustSec audit client
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --file apps/tui-rs/Cargo.lock
