name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
      - name: Install Babashka
        run: |
          scripts/install-ci-babashka.sh "$RUNNER_TEMP/qi-agent-bin"
          echo "$RUNNER_TEMP/qi-agent-bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/tui-rs/Cargo.toml --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path apps/tui-rs/Cargo.toml --all-targets -- -D warnings
      - name: Test all runtimes
        run: npm test

  package:
    name: Package (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-13
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
      - name: Verify tag matches package versions
        env:
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${QI_AGENT_TAG#v}"
          rust_version="$(cargo metadata --no-deps --format-version 1 --manifest-path apps/tui-rs/Cargo.toml | jq -r '.packages[] | select(.name == "qi-agent-tui") | .version')"
          node_version="$(node -p 'require("./package.json").version')"
          test "$version" = "$rust_version"
          test "$version" = "$node_version"
      - name: Test and build locked dependencies
        run: |
          cargo test --locked --manifest-path apps/tui-rs/Cargo.toml
          cargo build --release --locked --bins --manifest-path apps/tui-rs/Cargo.toml
      - name: Assemble runtime distribution
        env:
          QI_AGENT_TARGET: ${{ matrix.target }}
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package="qi-agent-${QI_AGENT_TAG}-${QI_AGENT_TARGET}"
          mkdir -p "dist/$package/apps/tui-rs/target/release"
          mkdir -p "dist/$package/apps/tui-rs/src"
          cp apps/tui-rs/target/release/qi-agent "dist/$package/apps/tui-rs/target/release/qi-agent"
          cp apps/tui-rs/target/release/dao "dist/$package/apps/tui-rs/target/release/dao"
          cp -R src plugins presets scripts examples docs assets protocol "dist/$package/"
          cp -R apps/web apps/web-host apps/shared apps/acp "dist/$package/apps/"
          cp apps/tui-rs/Cargo.toml apps/tui-rs/Cargo.lock "dist/$package/apps/tui-rs/"
          cp -R apps/tui-rs/src/. "dist/$package/apps/tui-rs/src/"
          cp bb.edn agent.edn package.json package-lock.json tsconfig.json vite.config.ts \
            LICENSE README.md README.zh-CN.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256")
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create aggregate checksums
        run: |
          find dist -maxdepth 1 -name '*.tar.gz' -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's#  dist/#  #' > dist/SHA256SUMS
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$QI_AGENT_TAG" >/dev/null 2>&1; then
            gh release upload "$QI_AGENT_TAG" dist/*
          else
            gh release create "$QI_AGENT_TAG" dist/* --verify-tag --generate-notes
          fi
