name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: qi-agent-releases
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Freeze source and require complete main CI for the exact commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
          QI_GATE_REPORT: release-ci.json
        run: |
          export QI_SOURCE_SHA="$(git rev-parse HEAD)"
          node maintenance/release-gate.mjs ci
          echo "sha=$QI_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-ci-evidence
          path: release-ci.json
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
      - name: Install Babashka
        run: |
          scripts/install-ci-babashka.sh "$RUNNER_TEMP/qi-agent-bin"
          echo "$RUNNER_TEMP/qi-agent-bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/tui-rs/Cargo.toml --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path apps/tui-rs/Cargo.toml --all-targets -- -D warnings
      - name: Test all runtimes
        run: npm test

  package:
    name: Package (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
      - name: Verify tag matches package versions
        env:
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
          QI_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$QI_SOURCE_SHA"
          node maintenance/release-gate.mjs tag
          version="${QI_AGENT_TAG#v}"
          rust_version="$(cargo metadata --no-deps --format-version 1 --manifest-path apps/tui-rs/Cargo.toml | jq -r '.packages[] | select(.name == "qi-agent-tui") | .version')"
          node_version="$(node -p 'require("./package.json").version')"
          test "$version" = "$rust_version"
          test "$version" = "$node_version"
      - name: Test and build locked dependencies
        run: |
          cargo test --locked --manifest-path apps/tui-rs/Cargo.toml
          cargo build --release --locked --bins --manifest-path apps/tui-rs/Cargo.toml
      - name: Assemble runtime distribution
        env:
          QI_AGENT_TARGET: ${{ matrix.target }}
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
          QI_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          package="qi-agent-${QI_AGENT_TAG}-${QI_AGENT_TARGET}"
          mkdir -p "dist/$package/apps/tui-rs/target/release"
          mkdir -p "dist/$package/apps/tui-rs/src"
          cp apps/tui-rs/target/release/qi-agent "dist/$package/apps/tui-rs/target/release/qi-agent"
          cp apps/tui-rs/target/release/dao "dist/$package/apps/tui-rs/target/release/dao"
          cp -R src plugins presets scripts examples docs assets protocol maintenance "dist/$package/"
          mkdir -p "dist/$package/evals"
          cp -R evals/lib "dist/$package/evals/"
          cp -R apps/web apps/web-host apps/shared apps/acp "dist/$package/apps/"
          cp apps/tui-rs/Cargo.toml apps/tui-rs/Cargo.lock "dist/$package/apps/tui-rs/"
          cp -R apps/tui-rs/src/. "dist/$package/apps/tui-rs/src/"
          cp bb.edn agent.edn package.json package-lock.json tsconfig.json vite.config.ts \
            LICENSE README.md README.zh-CN.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256")
          PACKAGE_ASSET="$package.tar.gz" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const asset = process.env.PACKAGE_ASSET;
            const sha256 = createHash("sha256").update(readFileSync("dist/" + asset)).digest("hex");
            writeFileSync("dist/" + asset + ".source.json", JSON.stringify({asset, sha256,
              sha: process.env.QI_SOURCE_SHA, tag: process.env.QI_AGENT_TAG}) + "\n");'
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.source.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*64
          path: dist
          merge-multiple: true
      - name: Verify complete assets, source, attestations and current CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
          QI_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          node maintenance/release-gate.mjs assets
          for asset in dist/*.tar.gz; do
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-digest "$QI_SOURCE_SHA"
          done
          node maintenance/release-gate.mjs ci
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QI_AGENT_TAG: ${{ inputs.tag || github.ref_name }}
          QI_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          node maintenance/release-gate.mjs tag
          if gh release view "$QI_AGENT_TAG" >/dev/null 2>&1; then
            gh release upload "$QI_AGENT_TAG" dist/*
          else
            gh release create "$QI_AGENT_TAG" dist/* --verify-tag --generate-notes
          fi
