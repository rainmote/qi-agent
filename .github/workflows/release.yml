name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-13
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tui-rs
      - name: Verify tag matches package versions
        env:
          DAO_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${DAO_TAG#v}"
          rust_version="$(cargo metadata --no-deps --format-version 1 --manifest-path apps/tui-rs/Cargo.toml | jq -r '.packages[] | select(.name == "bb-agent-tui") | .version')"
          node_version="$(node -p 'require("./package.json").version')"
          test "$version" = "$rust_version"
          test "$version" = "$node_version"
      - name: Test and build locked dependencies
        run: |
          cargo test --locked --manifest-path apps/tui-rs/Cargo.toml
          cargo build --release --locked --manifest-path apps/tui-rs/Cargo.toml
      - name: Assemble runtime distribution
        env:
          DAO_TARGET: ${{ matrix.target }}
          DAO_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package="dao-${DAO_TAG}-${DAO_TARGET}"
          mkdir -p "dist/$package/apps/tui-rs/target/release"
          mkdir -p "dist/$package/apps/tui-rs/src"
          cp apps/tui-rs/target/release/dao "dist/$package/apps/tui-rs/target/release/dao"
          cp -R src plugins scripts "dist/$package/"
          cp apps/tui-rs/Cargo.toml apps/tui-rs/Cargo.lock "dist/$package/apps/tui-rs/"
          cp -R apps/tui-rs/src/. "dist/$package/apps/tui-rs/src/"
          cp bb.edn agent.edn LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          shasum -a 256 "dist/$package.tar.gz" > "dist/$package.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create aggregate checksums
        run: |
          find dist -maxdepth 1 -name '*.tar.gz' -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's#  dist/#  #' > dist/SHA256SUMS
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          DAO_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$DAO_TAG" >/dev/null 2>&1; then
            gh release upload "$DAO_TAG" dist/* --clobber
          else
            gh release create "$DAO_TAG" dist/* --verify-tag --generate-notes
          fi
